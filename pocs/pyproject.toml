[project]
name = "relayforge-pocs"
version = "0.1.0"
description = "Harness aislado para las pruebas de concepto de RelayForge"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "psutil", "jsonschema", "mcp", "httpx"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
