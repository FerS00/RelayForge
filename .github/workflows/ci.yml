name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src/relayforge
      - name: Pytest
        run: uv run pytest -q
      - name: Personal path scan
        run: uv run python scripts/check_personal_paths.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Set up Python for Semgrep
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Semgrep
        run: semgrep scan --config p/default --metrics off --error --no-git-ignore src/relayforge web/src
      - name: Personal path scan
        run: python scripts/check_personal_paths.py
